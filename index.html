<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Посмотри в окно</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="page">
    <main class="content">
      <div class="result">
        <div class="result__video-container" id="video-container">
          <video
            class="result__video"
            id="result-video"
            src=""
            autoplay
            muted
            loop
          ></video>
        </div>
        <form class="search-form" id="search-form" action="#">
          <fieldset class="search-form__fieldset">
            <legend class="search-form__fieldset-title visually-hidden">
              Город
            </legend>
            <label class="search-form__label" for="city">
              <img
                class="search-form__icon"
                src="./img/icon_search.svg"
                alt="Поиск"
              />
              <input
                class="search-form__input"
                type="text"
                name="city"
                id="city"
                placeholder="Введите город"
              />
            </label>
          </fieldset>
          <fieldset class="search-form__fieldset">
            <legend class="search-form__fieldset-title">Ночь, день</legend>
            <ul class="search-form__checkbox-list">
              <li class="search-form__checkbox-list-item">
                <label class="search-form__label">
                  <input
                    class="search-form__checkbox visually-hidden"
                    type="checkbox"
                    name="time_of_day"
                    value="morning"
                  />
                  <span class="search-form__pseudo-checkbox"></span>
                  Утро
                </label>
              </li>
              <li class="search-form__checkbox-list-item">
                <label class="search-form__label">
                  <input
                    class="search-form__checkbox visually-hidden"
                    type="checkbox"
                    name="time_of_day"
                    value="day"
                  />
                  <span class="search-form__pseudo-checkbox"></span>
                  День
                </label>
              </li>
              <li class="search-form__checkbox-list-item">
                <label class="search-form__label">
                  <input
                    class="search-form__checkbox visually-hidden"
                    type="checkbox"
                    name="time_of_day"
                    value="evening"
                  />
                  <span class="search-form__pseudo-checkbox"></span>
                  Вечер
                </label>
              </li>
              <li class="search-form__checkbox-list-item">
                <label class="search-form__label">
                  <input
                    class="search-form__checkbox visually-hidden"
                    type="checkbox"
                    name="time_of_day"
                    value="night"
                  />
                  <span class="search-form__pseudo-checkbox"></span>
                  Ночь
                </label>
              </li>
            </ul>
          </fieldset>
          <button class="button search-form__submit-button" type="submit">
            Найти
          </button>
        </form>
      </div>

      <div class="content__details">
        <h2 class="title">
          Смотреть в <span class="content__accent">окно</span>
        </h2>
        <div class="content__list-container" id="list-container">
          <ul class="content__list" id="card-list"></ul>
        </div>
      </div>
    </main>

    <!-- Шаблон карточки -->
    <template class="card-template">
      <li class="content__list-item">
        <a class="content__card-link" href="#">
          <article class="content__video-card">
            <img
              class="content__video-card-thumbnail"
              src=""
              alt=""
            />
            <div class="content__video-card-description-container">
              <h3 class="content__video-card-title"></h3>
              <p class="content__video-card-description"></p>
            </div>
          </article>
        </a>
      </li>
    </template>

    <!-- Шаблон прелоадера -->
    <template class="preloader-template">
      <div class="preloader">
        <span class="preloader__circle"></span>
      </div>
    </template>

    <!-- Шаблон кнопки «Показать ещё» -->
    <template class="more-button-template">
      <button class="button more-button" type="button">Показать ещё</button>
    </template>

    <!-- Шаблон ошибки -->
    <template class="error-template">
      <div class="result__error">
        <p class="result__error-text"></p>
      </div>
    </template>

    <script src="./script.js"></script>
  </body>
</html>
